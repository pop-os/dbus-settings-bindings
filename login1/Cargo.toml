[package]
name = "cosmic-login1-zbus"
version = "1.0.0"
description = "A dbus client (using zbus) for logind"
repository = "https://github.com/pop-os/dbus-settings-bindings"
readme = "README.md"
edition = "2024"
# Fork of logind-zbus (https://gitlab.com/flukejones/logind-zbus)
license = "MPL-2.0"
authors = ["Luke D Jones <luke@ljones.dev>"]
categories = ["os::unix-apis"]
keywords = ["systemd", "logind", "zbus"]

[dependencies]
serde.workspace = true
zbus.workspace = true

[dev-dependencies]
futures-lite = "2.5.0"
