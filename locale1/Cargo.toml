[package]
name = "locale1-zbus"
version = "1.0.0"
repository = "https://github.com/pop-os/dbus-settings-bindings"
description = "dbus bindings for org.freedesktop.locale1 with zbus"
edition = "2024"
license = "MPL-2.0"

[dependencies]
zbus.workspace = true

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
zbus.workspace = true
zbus.features = ["tokio"]
