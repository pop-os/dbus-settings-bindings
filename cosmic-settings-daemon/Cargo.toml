[package]
name = "cosmic-settings-daemon-zbus"
version = "1.0.0"
repository = "https://github.com/pop-os/dbus-settings-bindings"
description = "dbus bindings for com.system76.CosmicSettingsDaemon"
license = "MPL-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zbus.workspace = true

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
zbus.workspace = true
zbus.features = ["tokio"]
